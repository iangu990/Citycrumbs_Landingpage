<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact &amp; Support — Localogs</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #EA4726;
    --brown: #501100;
    --white: #FFFFFF;
    --lime: #EFFDC7;
    --ink: #000000;
    --grey-1: #353535;
    --grey-2: #787878;
    --grey-3: #BCBCBC;
    --line: #ECECEC;
    --r: 12px;
    --pad: clamp(20px, 5vw, 88px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Space Grotesk", sans-serif;
    color: var(--ink);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }

  a { color: inherit; text-decoration: none; }

  /* ---------- Header (same as homepage) ---------- */
  header.site {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.86);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
    padding-left: clamp(16px, 2.5vw, 32px);
    padding-right: clamp(16px, 2.5vw, 32px);
  }
  .site-inner { display: flex; align-items: center; justify-content: space-between; height: 74px; gap: 20px; max-width: 1280px; margin: 0 auto; width: 100%; }
  .logo { display: flex; align-items: center; color: var(--red); }
  .logo img { height: 44px; width: auto; display: block; }
  .nav-actions { display: flex; align-items: center; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1;
    padding: 14px 22px; border-radius: 999px; border: 1.5px solid transparent;
    cursor: pointer; transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    white-space: nowrap; letter-spacing: -0.01em;
  }
  .btn:active { transform: translateY(1px); }
  .btn--red { background: var(--red); color: var(--white); }
  .btn--red:hover { background: #d63c1d; }
  .btn--outline { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn--outline:hover { background: var(--ink); color: var(--white); }
  @media (max-width: 640px) {
    .site-inner { height: 64px; }
    .logo img { height: 31px; }
    .nav-actions { display: none; }
  }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(60px, 10vw, 120px) var(--pad);
  }

  .card {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .sub { margin-top: 20px; font-size: 18px; line-height: 1.5; color: var(--grey-1); }
  .mail-row { margin-top: 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mail { font-weight: 600; color: var(--red); font-size: 18px; word-break: break-all; }
  .mail:hover { text-decoration: underline; }
  .copy {
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 10px 18px; border-radius: var(--r); border: 1.5px solid var(--red);
    background: var(--white); color: var(--red); transition: background .15s, color .15s;
  }
  .copy:hover, .copy.done { background: var(--red); color: var(--white); }
  footer {
    padding: 24px var(--pad); border-top: 1px solid var(--line); color: var(--grey-3);
    font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  footer .legal-links { display: flex; gap: 20px; }
  footer a:hover { color: var(--red); }
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <a href="index.html" class="logo" aria-label="Localogs — back to home">
      <img src="assets/logo-localogs.png" alt="Localogs" />
    </a>
    <div class="nav-actions">
      <a href="index.html#waitlist" class="btn btn--outline">Become a Founding Local Creator</a>
      <a href="waitlist.html" class="btn btn--red">Join the Waitlist</a>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h1>Contact &amp; Support</h1>
    <p class="sub">For any question or collaboration, please contact us by E-mail:</p>
    <div class="mail-row">
      <a class="mail" href="mailto:info@localogs.com">info@localogs.com</a>
      <button class="copy" id="copyBtn" type="button">Copy</button>
    </div>
  </div>
</main>

<footer>
  <span>© 2026 Localogs</span>
  <span class="legal-links"><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></span>
</footer>

<script>
  const btn = document.getElementById('copyBtn');
  btn.addEventListener('click', async () => {
    const email = 'info@localogs.com';
    try { await navigator.clipboard.writeText(email); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = email;
      document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
    }
    btn.textContent = 'Copied!'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 2000);
  });
</script>
</body>
</html>
