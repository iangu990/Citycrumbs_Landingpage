<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Become a Founding Local Creator — Localogs</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #EA4726;
    --brown: #501100;
    --white: #FFFFFF;
    --lime: #EFFDC7;
    --ink: #000000;
    --grey-1: #353535;
    --grey-2: #787878;
    --grey-3: #BCBCBC;
    --line: #ECECEC;
    --r: 12px;
    --pad: clamp(20px, 5vw, 88px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Space Grotesk", sans-serif;
    color: var(--ink);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  header {
    padding: 28px var(--pad);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: inline-flex; align-items: center; color: var(--red); }
  .logo img { height: 32px; width: auto; display: block; }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(60px, 10vw, 120px) var(--pad);
  }

  .card { width: 100%; max-width: 560px; }

  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--red); margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    text-wrap: balance;
  }
  h1 .serif { color: var(--red); }

  .sub {
    margin-top: 16px;
    font-size: clamp(15px, 1.4vw, 17px);
    color: var(--grey-2);
    max-width: 44ch;
  }

  /* ---------- Form ---------- */
  form {
    margin-top: clamp(40px, 5vw, 56px);
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--grey-1);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    font-family: inherit;
    font-size: clamp(18px, 1.8vw, 22px);
    color: var(--ink);
    padding: 12px 2px;
    border: none;
    border-bottom: 1.5px solid var(--line);
    border-radius: 0;
    background: transparent;
    transition: border-color .15s ease;
  }
  .field input::placeholder { color: var(--grey-3); }
  .field input:focus { outline: none; border-bottom-color: var(--red); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1;
    padding: 18px 30px; border-radius: var(--r); border: none;
    cursor: pointer; transition: transform .15s ease, background .15s ease;
    white-space: nowrap; letter-spacing: -0.01em; width: 100%;
  }
  .btn:active { transform: translateY(1px); }
  .btn--red { background: var(--red); color: var(--white); }
  .btn--red:hover { background: #d63c1d; }

  /* ---------- Success ---------- */
  .success {
    display: none;
    text-align: center;
    padding: clamp(40px, 6vw, 72px) 0;
  }
  .success-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--lime);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 32px;
    font-size: 32px;
  }
  .success h2 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .success h2 .serif { color: var(--red); }
  .success p {
    margin-top: 16px;
    font-size: 17px;
    color: var(--grey-2);
    max-width: 38ch;
    margin-left: auto;
    margin-right: auto;
  }
  .success .back {
    display: inline-block;
    margin-top: 36px;
    font-size: 15px;
    font-weight: 600;
    color: var(--red);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---------- Footer ---------- */
  footer {
    padding: 24px var(--pad);
    border-top: 1px solid var(--line);
    color: var(--grey-3);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo" aria-label="Localogs — back to home">
    <img src="assets/logo-localogs.png" alt="Localogs" />
  </a>
</header>

<main>
  <div class="card">

    <div id="formState">
      <p class="eyebrow">Founding Local Creator</p>
      <h1>Tell us about <span class="serif">you.</span></h1>
      <p class="sub">Three quick fields. We'll be in touch.</p>

      <form id="applyForm" name="crumb-dropper" data-netlify="true" novalidate>
        <input type="hidden" name="form-name" value="crumb-dropper" />
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@city.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="link">A showcase of your city knowledge</label>
          <input type="url" id="link" name="link" placeholder="Instagram, blog, anything" required />
        </div>
        <button type="submit" class="btn btn--red">Become a Founding Local Creator</button>
      </form>
    </div>

    <div class="success" id="successState">
      <div class="success-icon">🥐</div>
      <h2>Application received.<br><span class="serif">We'll be in touch.</span></h2>
      <p>Thanks for applying. We'll review your submission and reach out soon.</p>
      <a href="index.html" class="back">← Back to Localogs</a>
    </div>

  </div>
</main>

<footer>
  <span>© 2026 Localogs</span>
  <span>Made for wanderers, by locals.</span>
</footer>

<script>
  document.getElementById('applyForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!this.checkValidity()) { this.reportValidity(); return; }
    var form = this;
    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(new FormData(form)).toString()
    })
    .then(function () {
      document.getElementById('formState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    })
    .catch(function () {
      alert('Something went wrong. Please try again.');
    });
  });
</script>
</body>
</html>
